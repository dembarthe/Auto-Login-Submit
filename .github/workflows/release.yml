name: Release
# Push a tag "vX.Y.Z" matching the version in src/manifest.json.
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag must match manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(node -p 'require("./src/manifest.json").version')
          [ "v$v" = "$TAG" ] || { echo "::error::tag $TAG != manifest version $v"; exit 1; }
      - run: sh scripts/build.sh
      - run: cd dist && sha256sum auto-login-extension.zip > auto-login-extension.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/auto-login-extension.zip
            dist/auto-login-extension.zip.sha256
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" auto-login-extension.zip auto-login-extension.zip.sha256 --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  chrome-web-store:
    # Runs only once the "chrome-web-store" environment has its secrets (see README).
    needs: build
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Upload and publish
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          set -eu
          if [ -z "$CWS_EXTENSION_ID" ] || [ -z "$CWS_REFRESH_TOKEN" ]; then
            echo "::notice::Chrome Web Store secrets not configured, skipping publish"; exit 0
          fi
          token=$(curl -fsS https://oauth2.googleapis.com/token \
            -d client_id="$CWS_CLIENT_ID" -d client_secret="$CWS_CLIENT_SECRET" \
            -d refresh_token="$CWS_REFRESH_TOKEN" -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$token"
          up=$(curl -fsS -X PUT -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" \
            -T auto-login-extension.zip \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID")
          echo "$up" | jq '{uploadState, itemError}'
          [ "$(echo "$up" | jq -r .uploadState)" = "SUCCESS" ]
          pub=$(curl -fsS -X POST -H "Authorization: Bearer $token" -H "x-goog-api-version: 2" -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish")
          echo "$pub" | jq '{status, statusDetail}'
          echo "$pub" | jq -e '.status | index("OK") or index("ITEM_PENDING_REVIEW")' >/dev/null
