<!doctype html>
<html><head><meta charset="utf-8"><title>Auto Login Submit - Options</title>
<style>
 body{font:14px system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 12px}
 textarea{width:100%;height:220px;font-family:monospace}
 button{padding:6px 14px;margin-top:8px}
 input[type=number]{width:90px}
 #msg{margin-left:10px;color:green}
</style></head>
<body>
 <h1>Auto Login Submit</h1>
 <p>Whitelisted domains (one per line). <code>example.com</code> also covers all its subdomains. Only HTTPS (and localhost) pages are processed.</p>
 <textarea id="domains" spellcheck="false"></textarea>
 <p><label>Delay before submit (ms): <input type="number" id="delay" min="0" max="10000" step="100"></label></p>
 <button id="save">Save</button><span id="msg"></span>
 <script src="common.js"></script><script src="options.js"></script>
</body></html>
